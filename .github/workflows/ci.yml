name: ORION CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Install dependencies
        run: sudo apt-get install -y cmake g++ python3

      - name: Make CI script executable
        run: chmod +x run_tests.sh

      - name: Create logs directory
        run: mkdir -p logs

      - name: Run ORION pipeline
        run: ./run_tests.sh
